# Pepper as a Flatpak: KDE's runtime, for Plasma's own Qt, image plugins and
# KWindowSystem, plus Qt's PySide6 base app. Build and install from the
# repository root:
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#       build/flatpak flatpak/com.jacksonv.Pepper.yml
app-id: com.jacksonv.Pepper
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: pepper
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Read-only, to open any image the file manager or Ctrl+O hands over,
  # including on removable drives.
  - --filesystem=host:ro
  # Plasma's colour scheme and fonts.
  - --filesystem=xdg-config/kdeglobals:ro
build-options:
  env:
    # Read by cleanup-BaseApp.sh: Pepper uses neither.
    BASEAPP_REMOVE_WEBENGINE: '1'
    BASEAPP_DISABLE_NUMPY: '1'
cleanup:
  # The base app's build tooling: headers, Qt's qmake specs, and the LLVM
  # that shiboken's binding generator runs on.
  - /include
  - /mkspecs
  - /lib/cmake
  - /lib/libLLVM*
  - /lib/libclang*
  - /bin/shiboken6*
  - /lib/python3*/site-packages/shiboken6_generator*
cleanup-commands:
  - /app/cleanup-BaseApp.sh
  - rm -f /app/cleanup-BaseApp*.sh
modules:
  - name: pepper
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/pepper
      - cp -r viewer_core pepper /app/share/pepper/
      - rm -rf /app/share/pepper/*/tests
      - find /app/share/pepper -name __pycache__ -prune -exec rm -rf {} +
      # By hash: the deployed files' timestamps don't survive installation.
      - python3 -m compileall -q --invalidation-mode checked-hash /app/share/pepper
      - install -Dm755 flatpak/launch.sh /app/bin/pepper
      - install -Dm644 pepper/resources/pepper.svg
          /app/share/icons/hicolor/scalable/apps/com.jacksonv.Pepper.svg
      # The checkout's entry, with the Flatpak's command and icon.
      - sed -e 's|^Exec=.*|Exec=pepper %F|'
            -e 's|^Icon=.*|Icon=com.jacksonv.Pepper|'
            desktop/pepper.desktop.in > com.jacksonv.Pepper.desktop
      - install -Dm644 -t /app/share/applications com.jacksonv.Pepper.desktop
      - install -Dm644 -t /app/share/metainfo flatpak/com.jacksonv.Pepper.metainfo.xml
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .flatpak-builder
          - build
