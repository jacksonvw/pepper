<?xml version="1.0" encoding="UTF-8"?>
<!-- Pepper: an eye. Pointed lids two units thick at the crown, an iris that
     keeps one unit clear of them, and the pupil cut through the iris.
     Drawn in the colour scheme's text colour, as Breeze's monochrome icons
     are: Plasma swaps in the current scheme's ColorScheme-Text, and anything
     that doesn't know the convention uses Breeze's default below. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <style type="text/css" id="current-color-scheme">.ColorScheme-Text { color: #232629; }</style>
  <path class="ColorScheme-Text" fill="currentColor" fill-rule="evenodd" d="M 0.5 8 A 7.688 7.688 0 0 1 15.5 8 A 7.688 7.688 0 0 1 0.5 8 Z M 2.5 8 A 5.781 5.781 0 0 1 13.5 8 A 5.781 5.781 0 0 1 2.5 8 Z"/>
  <circle class="ColorScheme-Text" cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="2"/>
</svg>
