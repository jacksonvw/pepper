  <rect x="2" y="7" width="7" height="8" rx="1" fill="#FFFFFF"/>
  <path fill="#FFFFFF" d="M 5 6 V 5 Q 5 4 6 4 H 11 Q 12 4 12 5 V 12 H 10 V 6 Z"/>
  <path fill="#FFFFFF" d="M 8 3 V 2 Q 8 1 9 1 H 14 Q 15 1 15 2 V 9 H 13 V 3 Z"/>
</svg>
